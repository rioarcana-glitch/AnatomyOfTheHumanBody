<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="text" id="searchBox" placeholder="Type a topic...">

<ul id="results"></ul>

<script>
// Your data
const data = {
  "digestive system": [
    "https://www.nhs.uk/tests-and-treatments/spleen-problems-and-spleen-removal/",
    "https://www.chp.edu/our-services/transplant/liver/education/organs/spleen-information",
    "https://www.nhsinform.scot/illnesses-and-conditions/stomach-liver-and-gastrointestinal-tract/spleen-problems-and-spleen-removal/",
    "https://my.clevelandclinic.org/health/body/21690-gallbladder",
    "https://www.hawaiipacifichealth.org/healthier-hawaii/be-healthy/what-does-the-appendix-do-other-questions-about-the-bodys-mystery-organ/",
    "https://my.clevelandclinic.org/health/body/24785-rectum-function",
    "https://my.clevelandclinic.org/health/body/21567-spleen"
  ],

  "reproductive system": [
    "https://my.clevelandclinic.org/health/articles/9118-female-reproductive-system"
  ],

  "circulatory system": [
    // (you didn’t include links here yet — add if you find more)
  ],

  "nervous system": [
    // (same here — add later if needed)
  ]
};
document.getElementById("searchBox").addEventListener("input", function() {
  const input = this.value.toLowerCase();
  const results = document.getElementById("results");

  results.innerHTML = "";

  for (let topic in data) {
    if (topic.includes(input)) {
      data[topic].forEach(link => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = link;
        a.textContent = topic + " - " + link;
        a.target = "_blank";
        li.appendChild(a);
        results.appendChild(li);
      });
    }
  }

  if (results.innerHTML === "") {
    results.innerHTML = "<li>No results found</li>";
  }
});
</script>

</body>
</html>
